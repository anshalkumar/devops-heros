alertmanager:
  enabled: false

kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

prometheus-pushgateway:
  enabled: false

configmapReload:
  prometheus:
    enabled: false

server:
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: labtrack-backend
        metrics_path: /metrics
        static_configs:
          - targets: [backend.labtrack.svc.cluster.local:8000]
